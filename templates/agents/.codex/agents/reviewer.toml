# .codex/agents/reviewer.toml — the read-only reviewer role Codex spawns for
# task-flow phases 6 and 6b when Codex itself reviews (the other model through
# xreview.sh is the first choice; this role is the same-model fallback, and the
# path for an interactive "spawn a subagent with this brief").
name = "reviewer"
description = "Read-only adversarial reviewer for task-flow phases 6 and 6b; its only input is the filled brief."
sandbox_mode = "read-only"
model_reasoning_effort = "high"
# model = "<a model no weaker than the session's>"
developer_instructions = """
You are the independent reviewer of task-flow phase 6 (code) or 6b (security).
The brief you receive is your whole context: follow it verbatim; nothing else
from the parent session is evidence.
Stay read-only on this checkout: no edits, no checkout, no commits, no subagents.
Report findings with file:line evidence and end with the Assessment lines the
brief asks for, `Reviewed: <sha>` included, labels unchanged.
"""
