# gitleaks config — extends the built-in ruleset.
# Docs: https://github.com/gitleaks/gitleaks
title = "ci-gate gitleaks config"

[extend]
useDefault = true

# Keep the allowlist TIGHT. Every entry here is a hole in the gate — prefer
# fixing/rotating a real secret over allowlisting it. Fixture dirs and
# *.example / *.sample files are the only broadly-safe defaults, and they are a
# by-design hole: a real secret in `.env.example` is not scanned.
#
# If you ever add a value-based entry, use `regexTarget = "match"` (or
# "secret") and ANCHOR the regex: with "line", a placeholder anywhere on the
# line excused a real secret beside it, and an unanchored literal matched
# against a generic-api-key span suppresses whatever follows it. The canonical
# AWS example pair (AKIAIOSFODNN7EXAMPLE / wJalr…) is already excluded by the
# default ruleset — do not re-add it.
[[allowlists]]
description = "fixture dirs and example files"
paths = [
  '''(^|/)tests?/.*fixtures?/''',
  '''(^|/)testdata/''',
  '''.*\.example$''',
  '''.*\.sample$''',
]

# For a ONE-OFF example in code/docs prefer an inline comment on that line —
# more surgical than a global regex and visible in review:
#   my_token = "sk_live_deadbeef..."   # gitleaks:allow
