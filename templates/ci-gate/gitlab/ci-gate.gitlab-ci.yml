# ci-gate — deterministic merge gate for GitLab CI.
#
# Install (see ../README.md):
#   1) vendor ci/ + .gitleaks.toml into the repo
#   2) add to the project .gitlab-ci.yml:
#        include:
#          - local: 'ci/ci-gate.gitlab-ci.yml'
#   3) Settings → Merge requests → enable "Pipelines must succeed"
#
# Jobs run in the built-in `.pre` stage, so your own `stages:` need no changes.
# Requires merge-request pipelines to be enabled (CI_MERGE_REQUEST_IID).

.gate_base:
  stage: .pre
  variables:
    GIT_DEPTH: 0            # full history so the MR base sha is reachable
  interruptible: true

secret-scan:
  extends: .gate_base
  image:
    # Pinned by DIGEST, not tag: a tag is re-pointable upstream, a digest is not.
    # Same version as PIN_VERSION in ci/gitleaks-fetch.sh — bump them together
    # (see ci/README.md → "Pinned gitleaks").
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -e
      # Range handling, three landmines this shape avoids:
      #  * gitleaks exits 0 when the git command inside it fails ("0 commits
      #    scanned, no leaks found") — so the range is validated with
      #    `git rev-list` first;
      #  * an empty word inside --log-opts (a stray space) silently scans
      #    nothing — hence ${RANGE:+ $RANGE};
      #  * without --text a `-diff` attribute hides a file from the scan, and
      #    without --diff-merges a secret added in a merge commit is invisible.
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        RANGE="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD"                 # MR: only the MR's commits
      elif [ "${CI_PIPELINE_SOURCE:-}" = "schedule" ]; then
        RANGE=""                                                        # scheduled: full-history audit
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && ! printf '%s' "$CI_COMMIT_BEFORE_SHA" | grep -qE '^0+$'; then
        RANGE="${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}"               # default branch: only new commits
      else
        RANGE=""                                                        # first push / zero-sha: full scan
      fi
      if [ -n "$RANGE" ] && ! git rev-list "$RANGE" >/dev/null; then
        echo "secret-scan: git cannot resolve '$RANGE' (shallow clone? force-pushed base?) — failing closed" >&2
        exit 2
      fi
      gitleaks detect --redact --no-banner -v --log-opts="--text --diff-merges=first-parent${RANGE:+ $RANGE}"

migration-guard:
  extends: .gate_base
  image: alpine:3.20
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  before_script:
    - apk add --no-cache git bash grep
  script:
    - bash ci/migration-guard.sh

# Invisible / direction-overriding code points in added lines (Trojan Source).
# awk-based; alpine's busybox awk is enough.
unicode-guard:
  extends: .gate_base
  image: alpine:3.20
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  before_script:
    - apk add --no-cache git bash
  script:
    - bash ci/unicode-guard.sh

# Changed-line coverage. The script is tool-agnostic (lcov / Cobertura / Clover),
# but only your test job knows how to PRODUCE the report — so wire that job to
# publish it as an artifact and uncomment this. Threshold and report path are the
# only knobs; the layer skips itself while GATE_COVERAGE_REPORT is unset, and
# fails closed on a missing, empty or unparseable report.
#   diff-coverage:
#     extends: .gate_base
#     image: alpine:3.20
#     rules: [ { if: '$CI_MERGE_REQUEST_IID' } ]
#     needs: [ { job: test, artifacts: true } ]     # ← your test job, publishing coverage.xml
#     before_script:
#       - apk add --no-cache git bash grep
#     variables:
#       GATE_COVERAGE_REPORT: coverage.xml          # or coverage/lcov.info, build/logs/clover.xml
#       GATE_COVERAGE_MIN: "80"
#       GATE_COVERAGE_STRICT: "1"                   # once the report path is proven
#     script:
#       - bash ci/diff-coverage.sh

# Optional: dependency / SCA scan is language-specific — wire your own here, e.g.
#   dep-audit:
#     extends: .gate_base
#     rules: [ { if: '$CI_MERGE_REQUEST_IID' } ]
#     image: node:22-alpine        # or your runtime
#     script:
#       - npm audit --audit-level=high        # pip-audit / govulncheck / etc.
