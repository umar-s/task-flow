# codex-security — OPTIONAL second security pass on merge requests (GitLab,
# SHELL executor). Docker / kubernetes executor → codex-security.gitlab-ci.yml,
# whose header explains what this pass is and is not: an LLM scanner, never
# part of the deterministic gate.
#
# Differences from the docker variant:
#   * no `image:` (ignored on a shell executor) — the host provides Node.js
#     22.13+ / 24 / 26, Python 3.10+ (plus `tomli` on 3.10) and git; the job
#     checks them before installing anything;
#   * the CLI and the results live in per-job directories under $TMPDIR (default
#     /tmp), removed in after_script — a shell runner is shared between
#     projects. The scanner refuses an output parent that is group- or
#     world-writable without the sticky bit: keep TMPDIR /tmp or a 0700 dir;
#   * CODEX_SECURITY_AUTH=chatgpt is allowed: the scanner then uses the runner
#     user's own login (`codex-security login --device-auth` as that user) and
#     your ChatGPT quota instead of an API key. Only for a private self-hosted
#     GitLab — that login file is a password, and every MR pipeline on this
#     runner can use it.
#
# Setup (the repository owner, once):
#   include: [ { local: 'ci/codex-security.shell.gitlab-ci.yml' } ]
#   GATE_RUNNER_TAG = the shell runner's tag (same variable as the gate).
#   CODEX_SECURITY_AUTH = api-key (default) → CODEX_SECURITY_API_KEY as in the
#     docker variant (masked + hidden + protected, scope codex-security/openai);
#     = chatgpt → no key; the runner user is logged in.
#   Ubuntu 23.10+ hosts with kernel.apparmor_restrict_unprivileged_userns=1:
#     the scanner's bundled `codex` sandbox (bwrap) needs an AppArmor profile for
#     that binary, or every scan exits 2.
# Knobs: CODEX_SECURITY_FAIL_ON (default high), CODEX_SECURITY_EFFORT (default
#   low), CODEX_SECURITY_MAX_COST (estimated USD), CODEX_SECURITY_EXTRA_ARGS.
# Exit codes, restored by codex-security-gate:
#   0 complete and clean · 1 findings at or above the threshold · 2 incomplete coverage or an error

.codex-security-merge-request-shell:
  tags: ["$GATE_RUNNER_TAG"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && $CI_MERGE_REQUEST_SOURCE_BRANCH_PROTECTED == "true" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"'

codex-security:
  extends: .codex-security-merge-request-shell
  stage: .post
  environment:
    name: codex-security/openai
    action: access
  variables:
    GIT_DEPTH: "0"
    CODEX_SECURITY_VERSION: "0.1.31"
  before_script:
    - |
      set -eu
      fail() { echo "codex-security: $* — failing closed" >&2; exit 2; }
      command -v git >/dev/null || fail "git not on the runner's PATH"
      command -v node >/dev/null || fail "node not on the runner's PATH (need 22.13+, 24 or 26)"
      command -v npm >/dev/null || fail "npm not on the runner's PATH"
      command -v python3 >/dev/null || fail "python3 not on the runner's PATH (need 3.10+)"
      node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit((a===22&&b>=13)||a===24||a===26?0:1)' \
        || fail "node $(node --version) is not 22.13+, 24 or 26"
      python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)' \
        || fail "python3 $(python3 --version 2>&1) is older than 3.10"
      CLI_DIR="${TMPDIR:-/tmp}/codex-security-cli-$CI_JOB_ID"
      npm install --prefix "$CLI_DIR" --ignore-scripts --no-audit --no-fund "@openai/codex-security@${CODEX_SECURITY_VERSION}"
  script:
    - |
      set -eu
      AUTH="${CODEX_SECURITY_AUTH:-api-key}"
      case "$AUTH" in
        api-key)
          if [ -z "${CODEX_SECURITY_API_KEY:-}" ]; then
            echo "codex-security: CODEX_SECURITY_API_KEY is not available to this MR (protected, environment codex-security/openai) — failing closed" >&2
            exit 2
          fi ;;
        chatgpt) ;;
        *) echo "codex-security: CODEX_SECURITY_AUTH must be api-key or chatgpt, got '$AUTH' — failing closed" >&2; exit 2 ;;
      esac
      CLI_DIR="${TMPDIR:-/tmp}/codex-security-cli-$CI_JOB_ID"
      CODEX_SECURITY_BIN="$CLI_DIR/node_modules/.bin/codex-security"
      RESULTS_DIR="${TMPDIR:-/tmp}/codex-security-results-$CI_JOB_ID"
      ARTIFACT_DIR="codex-security-artifacts"
      BASE_REVISION="$(git merge-base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA")"
      SCAN_JSON="${TMPDIR:-/tmp}/codex-security-scan-$CI_JOB_ID.json"   # outside the checkout: the scan refuses a dirty tree
      install -d -m 700 "$RESULTS_DIR" "$ARTIFACT_DIR/results"   # empty dirs are invisible to git

      set -- scan . --diff "$BASE_REVISION" --head "$CI_COMMIT_SHA" \
        --auth "$AUTH" --output-dir "$RESULTS_DIR" --json --headless \
        --fail-on-severity "${CODEX_SECURITY_FAIL_ON:-high}" \
        --effort "${CODEX_SECURITY_EFFORT:-low}"
      if [ -n "${CODEX_SECURITY_MAX_COST:-}" ]; then set -- "$@" --max-cost "$CODEX_SECURITY_MAX_COST"; fi
      # shellcheck disable=SC2086 — space-separated flags by contract
      if [ -n "${CODEX_SECURITY_EXTRA_ARGS:-}" ]; then set -- "$@" $CODEX_SECURITY_EXTRA_ARGS; fi

      set +e
      if [ "$AUTH" = api-key ]; then
        codex_security_api_key="$CODEX_SECURITY_API_KEY"
        unset CODEX_SECURITY_API_KEY
        OPENAI_API_KEY="$codex_security_api_key" "$CODEX_SECURITY_BIN" "$@" > "$SCAN_JSON"
        scan_exit="$?"
        unset codex_security_api_key
      else
        "$CODEX_SECURITY_BIN" "$@" > "$SCAN_JSON"
        scan_exit="$?"
      fi
      set -e

      case "$scan_exit" in
        0|1|2) ;;
        *) exit "$scan_exit" ;;
      esac

      "$CODEX_SECURITY_BIN" export "$RESULTS_DIR" \
        --export-format sarif \
        --source-root "$CI_PROJECT_DIR" \
        --output "$ARTIFACT_DIR/results.sarif"
      test -s "$ARTIFACT_DIR/results.sarif"
      cp -R "$RESULTS_DIR"/. "$ARTIFACT_DIR/results/"
      cp "$SCAN_JSON" "$ARTIFACT_DIR/scan.json"
      printf '%s\n' "$scan_exit" > "$ARTIFACT_DIR/scan-exit-code.txt"
      echo "codex-security: scan exit $scan_exit (0 clean · 1 findings at or above ${CODEX_SECURITY_FAIL_ON:-high} · 2 incomplete) — codex-security-gate restores it"
      exit 0
  after_script:
    - rm -rf -- "${TMPDIR:-/tmp}/codex-security-cli-$CI_JOB_ID" "${TMPDIR:-/tmp}/codex-security-results-$CI_JOB_ID" "${TMPDIR:-/tmp}/codex-security-scan-$CI_JOB_ID.json"
  artifacts:
    when: always
    access: maintainer
    expire_in: 7 days
    paths:
      - codex-security-artifacts/
    reports:
      sarif: codex-security-artifacts/results.sarif

codex-security-gate:
  extends: .codex-security-merge-request-shell
  stage: .post
  needs:
    - job: codex-security
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - |
      code="$(cat codex-security-artifacts/scan-exit-code.txt)" || { echo "codex-security-gate: no exit-code artifact — failing closed" >&2; exit 2; }
      case "$code" in
        0|1|2) exit "$code" ;;
        *) echo "codex-security-gate: unreadable exit code '$code' — failing closed" >&2; exit 2 ;;
      esac
