# ci-gate — SHELL-executor variant for GitLab.
#
# Use this instead of ci-gate.gitlab-ci.yml when your runner uses the `shell`
# executor: there `image:` is IGNORED and jobs run directly on the host, so the
# Docker variant silently won't run. This variant needs no docker and no runner
# changes — gitleaks is fetched as a pinned, checksum-verified binary in-job
# (ci/gitleaks-fetch.sh), which also avoids putting the runner in the docker
# group (docker socket access on a shell runner ≈ host root).
#
# Setup:
#   include: [ { local: 'ci/ci-gate.shell.gitlab-ci.yml' } ]
#   Set a project CI/CD variable  GATE_RUNNER_TAG = <your shell runner's tag>.
#   Host needs: git, bash, grep, awk, curl (or wget), tar, sha256sum (or shasum).

.gate_base_shell:
  stage: .pre
  tags: ["$GATE_RUNNER_TAG"]
  variables:
    GIT_DEPTH: 0            # full history: MR base + before-sha must be reachable
  interruptible: true

secret-scan:
  extends: .gate_base_shell
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: 0
    GITLEAKS_RUN_DIR: "$CI_PROJECT_DIR/.gitleaks-run"   # per-call extraction dir inside the job workspace
    GATE_PINNED_ONLY: "1"                               # never a stray gitleaks on the runner's PATH
  script:
    - GL="$(bash ci/gitleaks-bin.sh)"
    - |
      set -e
      # Range handling, three landmines this shape avoids:
      #  * gitleaks exits 0 when the git command inside it fails ("0 commits
      #    scanned, no leaks found") — so the range is validated with
      #    `git rev-list` first;
      #  * an empty word inside --log-opts (a stray space) silently scans
      #    nothing — hence ${RANGE:+ $RANGE};
      #  * without --text a `-diff` attribute hides a file from the scan, and
      #    without --diff-merges a secret added in a merge commit is invisible.
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        RANGE="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD"                 # MR: only the MR's commits
      elif [ "${CI_PIPELINE_SOURCE:-}" = "schedule" ]; then
        RANGE=""                                                        # scheduled: full-history audit
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && ! printf '%s' "$CI_COMMIT_BEFORE_SHA" | grep -qE '^0+$'; then
        RANGE="${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}"               # default branch: only new commits
      else
        RANGE=""                                                        # first push / zero-sha: full scan
      fi
      if [ -n "$RANGE" ] && ! git rev-list "$RANGE" >/dev/null; then
        echo "secret-scan: git cannot resolve '$RANGE' (shallow clone? force-pushed base?) — failing closed" >&2
        exit 2
      fi
      "$GL" detect --redact --no-banner -v --log-opts="--text --diff-merges=first-parent${RANGE:+ $RANGE}"
  after_script:
    # ~22 MB per run otherwise left on the host. Inside the workspace on purpose:
    # a noexec /tmp cannot run the binary, and if after_script is skipped (job
    # timeout/cancel on older GitLab) the next checkout's `git clean -ffdx`
    # removes it anyway — unless GIT_CLEAN_FLAGS is overridden.
    - rm -rf "$CI_PROJECT_DIR/.gitleaks-run"

migration-guard:
  extends: .gate_base_shell
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  script:
    - bash ci/migration-guard.sh          # runs directly on host (git/bash/grep)

unicode-guard:
  extends: .gate_base_shell
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
  script:
    - bash ci/unicode-guard.sh            # added lines of the MR (git/bash/awk)

# Changed-line coverage — same layer as the docker variant, running on the host.
# Your test job produces the report; this one only judges it. Skips itself while
# GATE_COVERAGE_REPORT is unset, fails closed on an unreadable one.
#   diff-coverage:
#     extends: .gate_base_shell
#     rules: [ { if: '$CI_MERGE_REQUEST_IID' } ]
#     needs: [ { job: test, artifacts: true } ]     # ← your test job, publishing the report
#     variables:
#       GATE_COVERAGE_REPORT: coverage.xml          # or coverage/lcov.info, build/logs/clover.xml
#       GATE_COVERAGE_MIN: "80"
#       GATE_COVERAGE_STRICT: "1"                   # once the report path is proven
#     script:
#       - bash ci/diff-coverage.sh

# Opt-in alternative for a DEDICATED shell runner that already has docker access
# and a warm image cache (faster, no per-run download). Only where you accept the
# docker-group trade-off — never on a shared runner:
#   secret-scan:
#     extends: .gate_base_shell
#     rules: [ { if: '$CI_MERGE_REQUEST_IID' }, { if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' } ]
#     script:
#       - command -v docker >/dev/null || { echo "docker not available on this runner"; exit 2; }
#       - docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --redact --no-banner -v
