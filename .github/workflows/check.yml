# check — this repository under its own rules.
#
# The product ships a deterministic gate into other repos; this workflow runs the
# same secret-scan over this repo's own changes (dogfood) plus the Tier-1 lint
# that turns CLAUDE.md's written rules into greps. Pins mirror templates/ci-gate.
name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'          # weekly full-history secret audit

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: repository invariants
        run: bash scripts/lint.sh
      - name: release state
        run: bash scripts/release-check.sh
      - name: workflow lint (actionlint — the shipped GitHub template and this file)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color \
            templates/ci-gate/github/gate.yml .github/workflows/check.yml
      - name: yaml lint (GitLab templates, pre-commit)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check yamllint==1.38.0
          python3 -m yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            templates/ci-gate/gitlab/ templates/ci-gate/.pre-commit-config.yaml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          RANGE=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE=("--log-opts=origin/${BASE_REF}..HEAD")
          elif [ "$EVENT_NAME" = "push" ]; then
            if ! printf '%s' "$BEFORE_SHA" | grep -qE '^0+$'; then
              RANGE=("--log-opts=${BEFORE_SHA}..${HEAD_SHA}")
            fi
          fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE" \
            detect --source /repo --config /repo/templates/ci-gate/.gitleaks.toml \
            --redact --no-banner -v "${RANGE[@]}"
